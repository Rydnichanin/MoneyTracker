name: Build static content (no Pages deploy)

on:
  push:
    branches: ["main"]
    paths:
      - 'index.html'
      - 'auth.html'
      - 'manifest.json'
      - 'style.css'
      - 'sw.js'
      - 'ai_parser.js'
      - 'icon.png'
      - 'js/**'
      - 'scripts/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build optimized web artifact
        run: python3 scripts/build-site.py
      - name: Verify build
        run: test -f _site/index.html && test -f _site/style.css
