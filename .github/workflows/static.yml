name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'index.html'
      - 'auth.html'
      - 'manifest.json'
      - 'style.css'
      - 'sw.js'
      - 'ai_parser.js'
      - 'icon.png'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web artifact
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html auth.html manifest.json style.css sw.js ai_parser.js icon.png _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
