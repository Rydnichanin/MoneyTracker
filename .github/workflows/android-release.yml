name: Publish signed Android release

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: android-releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Validate release version and signing secrets
        id: release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          import os

          gradle = Path('app/build.gradle').read_text()
          name = re.search(r'versionName\s+"([^"]+)"', gradle).group(1)
          code = int(re.search(r'versionCode\s+(\d+)', gradle).group(1))
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'android-v{name}':
              raise SystemExit(f'Tag {tag} must match app/build.gradle versionName ({name}): android-v{name}')
          current = json.loads(Path('version.json').read_text())
          published_code = int(current.get('androidVersionCode', 0))
          if code <= published_code:
              raise SystemExit(f'versionCode {code} must be greater than published androidVersionCode {published_code}')
          for key in ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'):
              if not os.environ.get(key):
                  raise SystemExit(f'Missing GitHub Actions secret: {key}')
          print(f'version_name={name}')
          print(f'version_code={code}')
          PY

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moneytracker-release.pfx"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/moneytracker-release.pfx" >> "$GITHUB_ENV"

      - name: Verify signing key alias
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: keytool -list -keystore "$RUNNER_TEMP/moneytracker-release.pfx" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --warning-mode none

      - name: Name release asset
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MoneyTracker.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/MoneyTracker.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              app/build/outputs/apk/release/MoneyTracker.apk \
              --title "Учёт Курьера Pro ${{ steps.release.outputs.version_name }}" \
              --generate-notes
          fi

      - name: Publish version metadata to the website
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create publish-android-version origin/main
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('version.json')
          data = json.loads(path.read_text())
          if int(os.environ['VERSION_CODE']) <= int(data.get('androidVersionCode', 0)):
              raise SystemExit('This release is older than the Android version already published on main.')
          data['androidVersionName'] = os.environ['VERSION_NAME']
          data['androidVersionCode'] = int(os.environ['VERSION_CODE'])
          data['androidChangelog'] = f"Обновление приложения до версии {os.environ['VERSION_NAME']}"
          data['androidReleaseUrl'] = 'https://github.com/Rydnichanin/MoneyTracker/releases/latest/download/MoneyTracker.apk'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Publish Android version $VERSION_NAME"
          git push origin HEAD:main

      - name: Deploy the updated version checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run priority-pages.yml --ref main
