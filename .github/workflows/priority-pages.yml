name: Priority Firebase Pages deploy

on:
  push:
    branches: [Test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-priority-test"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Test branch
        uses: actions/checkout@v4

      - name: Build with priority Firebase loading
        run: python3 scripts/build-site-priority.py

      - name: Verify production bundle
        run: |
          set -euo pipefail
          grep -q 'where("date", "==", todayForPriority)' _site/js/inline-*.js
          grep -q 'loadDateRange' _site/js/inline-*.js
          grep -q 'startup-profiler.js' _site/index.html
          if grep -q 'scheduleFullHistory' _site/js/inline-*.js; then
            echo 'ERROR: automatic full-history loading is still present'
            exit 1
          fi
          if grep -q 'ai_parser.js' _site/index.html; then
            echo 'ERROR: AI parser is still referenced from initial HTML'
            exit 1
          fi
          echo 'Priority loading and startup profiler verified.'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy Test artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
