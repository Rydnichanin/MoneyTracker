name: Apply AI WhatsApp parser and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'ai_parser.js'
      - 'index.html'
      - '.github/workflows/apply-ai-parser.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject AI parser into index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/ai_parser.js?v=3"></script>'
          # Remove old parser tags so only v3 remains.
          import re
          s = re.sub(r'<script\s+src=["\']/ai_parser\.js(?:\?[^"\']*)?["\']\s*></script>\s*', '', s, flags=re.I)
          if '</body>' in s:
              s = s.replace('</body>', tag + '\n</body>', 1)
          else:
              s += '\n' + tag + '\n'
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit index.html change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already contains AI parser v3'
          else
            git commit -m 'Подключить AI-парсер v3 к приложению'
            git push origin main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
