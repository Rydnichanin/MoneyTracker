name: Build Android debug APK

on:
  push:
    branches:
      - main
      - master
      - 'perf/startup-optimization'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: gradle assembleDebug --warning-mode none

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
