name: Validate optimized web build

on:
  pull_request:
    paths:
      - 'index.html'
      - 'auth.html'
      - 'style.css'
      - 'sw.js'
      - 'ai_parser.js'
      - 'manifest.json'
      - 'icon.png'
      - 'scripts/**'
      - '.github/workflows/validate-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build optimized site
        run: python3 scripts/build-site.py

      - name: Validate artifact
        run: |
          set -e
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/sw.js
          ! grep -qi '<style' _site/index.html
          ! grep -Eq 'src=["'"']/ai_parser\.js' _site/index.html
          test "$(find _site/js -type f -name '*.js' | wc -l)" -ge 1
          echo "Optimized artifact is valid"
