name: Test MoneyTracker build

on:
  push:
    branches:
      - Test
    paths:
      - 'index.html'
      - 'auth.html'
      - 'style.css'
      - 'sw.js'
      - 'ai_parser.js'
      - 'manifest.json'
      - 'icon.png'
      - 'js/**'
      - 'scripts/**'
      - '.github/workflows/test-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Test branch
        uses: actions/checkout@v4

      - name: Build test site
        run: python3 scripts/build-site.py

      - name: Verify required files
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/auth.html
          test -s _site/manifest.json
          test -s _site/sw.js
          test -s _site/js/ai-loader.js
          test -s _site/ai_parser.js

      - name: Verify optimized HTML
        run: |
          set -euo pipefail
          if grep -qi '<style' _site/index.html; then
            echo 'ERROR: inline style block remains in _site/index.html'
            exit 1
          fi
          if grep -q 'ai_parser.js' _site/index.html; then
            echo 'ERROR: ai_parser.js is still loaded directly from initial HTML'
            exit 1
          fi
          grep -q 'ai_parser.js' _site/js/ai-loader.js
          grep -q 'ai-loader.js' _site/index.html
          echo 'Test build passed.'
