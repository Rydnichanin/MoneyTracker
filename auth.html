<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход в Учёт Курьера Pro</title>
  <style>
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; text-align: center; padding: 24px; box-sizing: border-box; }
    .icon { font-size: 52px; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
    p { color: #777; font-size: 14px; margin: 0 0 32px; max-width: 320px; line-height: 1.4; }
    button {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: #fff; color: #000; border: none; border-radius: 14px;
      padding: 16px 32px; font-size: 16px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,255,255,0.15); width: 100%; max-width: 300px;
    }
    button:active { transform: scale(0.98); }
    .status { margin-top: 24px; font-size: 14px; color: #888; max-width: 320px; word-break: break-word; }
    .status.error { color: #ff6b6b; }
    .status.success { color: #65d48b; font-weight: 600; }
    .app-link {
      display: none; margin-top: 18px; padding: 12px 24px; background: #1a2a1a;
      color: #65d48b; border: 1px solid #2a4a2a; border-radius: 10px;
      text-decoration: none; font-size: 14px; font-weight: 600;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="icon">🔐</div>
  <h2>Вход в аккаунт</h2>
  <p>Войдите через Google для синхронизации всех данных</p>
  <div id="gsiSlot" style="margin-bottom:12px;display:flex;justify-content:center;min-height:44px;"></div>
  <button id="loginBtn" onclick="doLogin()">
    <svg width="20" height="20" viewBox="0 0 48 48">
      <path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 29.8 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.6 20-21 0-1.4-.1-2.7-.5-4z"/>
    </svg>
    Войти через Google
  </button>
  <div class="status" id="status"></div>
  <a id="appLink" class="app-link" href="#">Вернуться в приложение</a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signInWithCredential } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const app = initializeApp({
      apiKey: "AIzaSyBYvSsrzjgkrBwhaBAt0KlCGrAtzgOPYx8",
      authDomain: "moneytracker-5335b.firebaseapp.com",
      projectId: "moneytracker-5335b",
      storageBucket: "moneytracker-5335b.firebasestorage.app",
      messagingSenderId: "440589448883",
      appId: "1:440589448883:web:5ad507b270fa414731a2c6"
    });

    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    async function handleUserSuccess(resultOrUser) {
      const btn = document.getElementById("loginBtn");
      const status = document.getElementById("status");
      const appLink = document.getElementById("appLink");
      btn.style.display = "none";
      status.textContent = "✅ Вход выполнен! Возврат в приложение...";
      status.className = "status success";

      let user = resultOrUser?.user || resultOrUser;
      let idToken = null;

      try {
        const cred = GoogleAuthProvider.credentialFromResult(resultOrUser);
        if (cred && cred.idToken) idToken = cred.idToken;
      } catch(e) {}

      if (!idToken && resultOrUser?._tokenResponse?.idToken) {
        idToken = resultOrUser._tokenResponse.idToken;
      }

      if (!idToken && user && typeof user.getIdToken === 'function') {
        idToken = await user.getIdToken();
      }

      const name = encodeURIComponent(user?.displayName || "");
      const email = encodeURIComponent(user?.email || "");

      // 1. Сохраняем токен в localStorage / sessionStorage
      try { sessionStorage.setItem("pendingIdToken", idToken); } catch(e) {}
      try {
        localStorage.setItem("pendingIdToken", idToken);
        localStorage.setItem("pendingName", user.displayName || "");
        localStorage.setItem("pendingEmail", user.email || "");
      } catch(e) {}

      // 2. Если открыто во всплывающем окне через window.opener
      try {
        if (window.opener && window.opener.receiveAuthToken) {
          window.opener.receiveAuthToken({ idToken, name: user.displayName, email: user.email });
          window.close();
          return;
        }
      } catch(e) {}

      // 3. Deep link обратно в APK
      const deepLink = `moneytracker://auth?idToken=${encodeURIComponent(idToken)}&name=${name}&email=${email}`;
      if (appLink) {
        appLink.href = deepLink;
        appLink.style.display = "inline-block";
      }

      const isApk = /AndroidBridge/i.test(navigator.userAgent) || !!window.AndroidBridge;
      if (isApk) {
        window.location.href = deepLink;
      } else {
        // В обычном веб-браузере возвращаемся в основное приложение
        status.innerHTML = "✅ Вход выполнен!<br><span style='font-size:12px;color:#aaa;'>Возвращаемся в приложение...</span>";
        setTimeout(() => {
          window.location.href = "./index.html";
        }, 1200);
      }

      setTimeout(() => {
        if (isApk) {
          status.innerHTML = "✅ Вход подтверждён!<br><span style='font-size:12px;color:#aaa;'>Если приложение не открылось автоматически, нажмите кнопку ниже:</span>";
        }
      }, 2000);
    }

    // Проверяем результат редиректа при загрузке страницы
    getRedirectResult(auth).then(result => {
      if (result && result.user) {
        handleUserSuccess(result);
      }
    }).catch(e => {
      console.warn("getRedirectResult status:", e);
      if (sessionStorage.getItem("authRedirectPending") === "1") {
        sessionStorage.removeItem("authRedirectPending");
        const status = document.getElementById("status");
        if (status && e?.message && e.code !== 'auth/popup-closed-by-user') {
          status.textContent = "Ошибка: " + e.message;
          status.className = "status error";
        }
      }
    });

    function initGsi() {
      if (typeof window.google === 'undefined' || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(initGsi, 250);
        return;
      }
      try {
        window.google.accounts.id.initialize({
          client_id: "440589448883-e87fh2fe04qcpa4hlujtk5e86b8v6b3i.apps.googleusercontent.com",
          callback: async (response) => {
            if (!response || !response.credential) return;
            try {
              const cred = GoogleAuthProvider.credential(response.credential);
              const userCred = await signInWithCredential(auth, cred);
              await handleUserSuccess(userCred || { idToken: response.credential });
            } catch(e) {
              console.warn("GIS signInWithCredential fallback:", e);
              await handleUserSuccess({ idToken: response.credential });
            }
          },
          auto_select: false,
          cancel_on_tap_outside: true
        });

        const slot = document.getElementById("gsiSlot");
        if (slot) {
          window.google.accounts.id.renderButton(slot, {
            theme: "filled_blue",
            size: "large",
            shape: "rectangular",
            text: "signin_with",
            width: 280,
            locale: "ru"
          });
          const loginBtn = document.getElementById("loginBtn");
          if (loginBtn) loginBtn.style.display = "none";
        }
      } catch(e) {
        console.warn("initGsi error:", e);
      }
    }
    if (document.readyState === 'complete') {
      initGsi();
    } else {
      window.addEventListener('load', initGsi);
    }

    window.doLogin = async () => {
      const btn = document.getElementById("loginBtn");
      const status = document.getElementById("status");
      btn.disabled = true;
      btn.style.opacity = "0.6";
      status.textContent = "Выполняется вход через Google...";
      status.className = "status";

      try {
        const result = await signInWithPopup(auth, provider);
        if (result && result.user) {
          await handleUserSuccess(result);
        }
      } catch (e) {
        console.warn("signInWithPopup error:", e);
        // В мобильных браузерах часто блокируется popup — переходим на redirect
        if (e?.code === 'auth/popup-blocked' || e?.code === 'auth/internal-error' || e?.code === 'auth/operation-not-supported-in-this-environment' || /mobile|android|iphone|ipad/i.test(navigator.userAgent)) {
          try {
            status.textContent = "Перенаправление на Google...";
            sessionStorage.setItem("authRedirectPending", "1");
            await signInWithRedirect(auth, provider);
            return;
          } catch(re) {
            status.textContent = "Ошибка: " + (re?.message || "Попробуйте снова");
            status.className = "status error";
          }
        } else if (e?.code !== 'auth/popup-closed-by-user' && e?.code !== 'auth/cancelled-popup-request') {
          status.textContent = "Ошибка входа: " + (e?.message || "Попробуйте снова");
          status.className = "status error";
        } else {
          status.textContent = "";
        }
        btn.disabled = false;
        btn.style.opacity = "1";
      }
    };
  </script>
</body>
</html>
